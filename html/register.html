<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrazione</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    
    <div class="app-container">
        <main class="main-content" id="registerPageContent">
            
            <a href="./login.html" class="page-back-arrow"><</a>
            
            <div class="auth-container">
                <img src="../assets/logo.png" alt="App Logo" class="logo">
                
                <h1 class="title">Registrazione</h1>

                <form class="auth-form">
                    <input type="text" placeholder="Nome">
                    <input type="text" placeholder="Cognome">
                    <input type="text" placeholder="Data di nascita">
                    <input type="email" placeholder="Email">
                    <input type="password" placeholder="Password">
                    <input type="password" placeholder="Conferma Password">
                    <button type="button" id="registerButton" class="btn-primary">Registrati</button>
                </form>
            </div>

        </main>
    </div>

    <script src="../javascript/script.js"></script>
</body>
</html>
