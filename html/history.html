<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Storico</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>

    <div class="app-container">
        <main class="main-content" id="historyPage">
            <div class="page-header history-header">
                <h1 class="header-title">Storico</h1>
                <a href="./calendar.html" id="calendarIcon" class="calendar-icon">
                    <i class="fas fa-calendar-alt"></i>
                </a>
            </div>

            <div class="day-navigator">
                <a href="#" class="nav-arrow" id="prevDayBtn"><</a>
                <span id="currentDateDisplay">Oggi</span>
                <a href="#" class="nav-arrow" id="nextDayBtn">></a>
            </div>

            <div class="entry-display" id="entryContent">
                <!-- Content populated by JS -->
            </div>
            
             <div class="no-entry-display" id="noEntryMessage" style="display: none;">
                <p>Nessuna voce per questo giorno.</p>
            </div>

        </main>

        <nav class="bottom-nav">
            <a href="./home.html" class="nav-item">
                <i class="fas fa-home"></i>
            </a>
            <a href="./history.html" class="nav-item active">
                <i class="fas fa-book-open"></i>
            </a>
            <a href="./user-profile.html" class="nav-item">
                <i class="fas fa-user"></i>
            </a>
        </nav>
    </div>

    <script src="../javascript/script.js"></script>
</body>
</html>
