<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calendario</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <div class="app-container">
        <main class="main-content" id="calendarPage">
            <div class="page-header history-header">
                <h1 class="header-title">Calendario</h1>
                <a href="./history.html" class="calendar-icon today-icon" id="todayLink">8</a>
            </div>

            <div class="day-navigator">
                <a href="#" class="nav-arrow" id="prevMonthBtn"><</a>
                <span id="currentMonthDisplay">Luglio 2025</span>
                <a href="#" class="nav-arrow" id="nextMonthBtn">></a>
            </div>

            <div class="calendar-grid">
                <div class="day-name">Lun</div>
                <div class="day-name">Mar</div>
                <div class="day-name">Mer</div>
                <div class="day-name">Gio</div>
                <div class="day-name">Ven</div>
                <div class="day-name">Sab</div>
                <div class="day-name">Dom</div>
            </div>
        </main>
        <nav class="bottom-nav">
            <a href="./home.html" class="nav-item">
                <i class="fas fa-home"></i>
            </a>
            <a href="./history.html" class="nav-item active">
                <i class="fas fa-book-open"></i>
            </a>
            <a href="./user-profile.html" class="nav-item">
                <i class="fas fa-user"></i>
            </a>
        </nav>
    </div>
    <script src="../javascript/script.js"></script>
</body>
</html>
